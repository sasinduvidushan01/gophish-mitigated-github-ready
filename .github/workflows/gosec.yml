name: "Gosec"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  gosec:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Run Gosec Security Scanner
        uses: securego/gosec@9addc97cefc9460a114e3c36f536b935da3b98c9 # master branch
        with:
          # G104 (errors unhandled) is excluded - it is a code quality issue,
          # not a security vulnerability. All other rules are enforced.
          args: '-no-fail -fmt sarif -out results.sarif -exclude=G104 ./...'
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
