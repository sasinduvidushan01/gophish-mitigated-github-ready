name: Build Windows Installer

# Click "Run workflow" on the Actions tab to start this by hand.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build the Gophish program (gophish-mitigated.exe)
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -o gophish-mitigated.exe .

      - name: Install NSIS (the installer packer)
        run: choco install nsis -y --no-progress

      - name: Write the installer files
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("installer.nsi",   [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("run-gophish.cmd", [Convert]::FromBase64String("QGVjaG8gb2ZmCnJlbSBMYXVuY2ggR29waGlzaCBmcm9tIGl0cyBvd24gaW5zdGFsbCBmb2xkZXIgc28gaXQgZmluZHMKcmVtIGNvbmZpZy5qc29uLCBzdGF0aWNcLCB0ZW1wbGF0ZXNcIGFuZCBkYlwgdmlhIHJlbGF0aXZlIHBhdGhzLgpjZCAvZCAiJX5kcDAiCiIlfmRwMGdvcGhpc2gtbWl0aWdhdGVkLmV4ZSIK"))
          [IO.File]::WriteAllBytes("config.json",     [Convert]::FromBase64String(""))

      - name: Pack the installer (gophish-setup.exe)
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'

      - name: Upload gophish-setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: gophish-setup
          path: gophish-setup.exe
          if-no-files-found: error
