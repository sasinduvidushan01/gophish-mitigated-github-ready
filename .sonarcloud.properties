sonar.exclusions=static/css/**/*.css,static/plugins/**/*,static/js/src/vendor/**/*,static/js/dist/**/*,templates/**/*.html

# Exclude SQL migrations from duplication checks (intentionally repeated UPDATE patterns)
sonar.cpd.exclusions=db/**/*.sql

# Ignore legacy maintainability code smells that require risky refactoring
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14

# JS: var keyword (legacy code predates ES6)
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3504
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js

# Go: Cognitive Complexity > 15 (refactoring core controllers/models risks instability)
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.go

# Go: String literal duplication (SQL/template patterns are intentionally repeated)
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.go

# Go: deprecated packages (legacy dependency, not yet migrated)
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S1191
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.go

# Go: TODO comments (tracked externally, not inline)
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.go

# Go: exported type naming (external API compatibility)
sonar.issue.ignore.multicriteria.e6.ruleKey=go:S101
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.go

# JS: TODO comments
sonar.issue.ignore.multicriteria.e7.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.js

# JS: switch with too many cases (legacy table-driven logic)
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S1479
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*.js

# JS: Cognitive Complexity > 15 (complex render/timeline functions)
sonar.issue.ignore.multicriteria.e9.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*.js

# JS: Unexpected negated condition (idiomatic != -1 guard patterns throughout)
sonar.issue.ignore.multicriteria.e10.ruleKey=javascript:S1940
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*.js

# JS: Multiline string literal with backslash continuation (legacy HTML table builders)
sonar.issue.ignore.multicriteria.e11.ruleKey=javascript:S2391
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*.js

# JS: String.raw for regex escapes (display strings, not regex patterns)
sonar.issue.ignore.multicriteria.e12.ruleKey=javascript:S6535
sonar.issue.ignore.multicriteria.e12.resourceKey=**/*.js

# JS: prefer globalThis over window (remaining legacy window usages in HTML templates)
sonar.issue.ignore.multicriteria.e13.ruleKey=javascript:S6299
sonar.issue.ignore.multicriteria.e13.resourceKey=**/*.js

# JS: typeof undefined comparison (legacy pattern)
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S4322
sonar.issue.ignore.multicriteria.e14.resourceKey=**/*.js
